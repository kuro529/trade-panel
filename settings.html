<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚙️ 設定</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07070f; color: #dde; font-family: -apple-system, sans-serif; min-height: 100vh; padding-bottom: 0; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 18px 16px; border-bottom: 1px solid #12121f; position: sticky; top: 0; background: #07070f; z-index: 100; }
.title { font-size: 18px; font-weight: 800; color: #fff; }
.btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #00e5a044; background: #00e5a010; color: #00e5a0; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; white-space: nowrap; }
.status { padding: 8px 16px; font-size: 12px; color: #555; border-bottom: 1px solid #12121f; }
.status.err { color: #ff8fa3; }
.section { padding: 16px; border-bottom: 1px solid #12121f; }
.section-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 12px; }
.section-note { font-size: 11px; color: #555; font-weight: 400; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.row label { flex: 1; font-size: 12px; color: #888; }
.row input { width: 80px; background: #0d0d1a; border: 1px solid #222236; color: #ccc; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: right; }
.pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.pair-label { flex: 1; font-size: 12px; color: #888; }
.pair-inputs { display: flex; gap: 6px; align-items: center; }
.pair-inputs span { font-size: 10px; color: #555; }
.pair-inputs input { width: 70px; background: #0d0d1a; border: 1px solid #222236; color: #ccc; border-radius: 6px; padding: 6px 8px; font-size: 13px; text-align: right; }
.save-bar { position: sticky; bottom: 0; background: #0d0d1a; border-top: 1px solid #222236; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 200; }
.save-bar .btn { flex: 1; text-align: center; padding: 10px; font-size: 14px; }
.btn-save { background: #00e5a0; color: #000; border: none; }
.btn-reset { background: #ff4d6d10; color: #ff4d6d; border: 1px solid #ff4d6d44; }
</style>
</head>
<body>
<div class="header">
  <div class="title">⚙️ 設定</div>
  <a href="index.html" class="btn">← 戻る</a>
</div>

<div class="status" id="statusBar">読み込み中...</div>

<div class="section">
  <div class="section-title">自動売買設定</div>
  <div class="row"><label>証拠金(USDT)</label><input type="number" id="tradeMargin" step="1"></div>
  <div class="row"><label>レバレッジ(倍)</label><input type="number" id="tradeLeverage" step="1"></div>
</div>

<div class="section">
  <div class="section-title">TP/SL幅(BB率別、%)</div>
  <div class="row"><label>BB率50%以上</label><input type="number" id="tpslRate50" step="1"></div>
  <div class="row"><label>BB率30%以上</label><input type="number" id="tpslRate30" step="1"></div>
  <div class="row"><label>BB率10%以上</label><input type="number" id="tpslRate10" step="1"></div>
  <div class="row"><label>BB率10%未満</label><input type="number" id="tpslRateLow" step="1"></div>
</div>

<div class="section">
  <div class="section-title">シグナル閾値</div>
  <div class="row"><label>弱</label><input type="number" id="thWeak" step="0.5"></div>
  <div class="row"><label>中</label><input type="number" id="thMid" step="0.5"></div>
  <div class="row"><label>強</label><input type="number" id="thStrong" step="0.5"></div>
</div>

<div class="section">
  <div class="section-title">HOLD判定</div>
  <div class="section-note">スコア＋トレンド指数の合計で判定します</div>
  <div class="row"><label>HOLD+ の下限（この値以上）</label><input type="number" id="holdPlus" step="0.5"></div>
  <div class="row"><label>HOLD- の上限（この値以下）</label><input type="number" id="holdMinus" step="0.5"></div>
</div>

<div class="section">
  <div class="section-title">MACD</div>
  <div class="row"><label>DIF&gt;0&gt;Sig 拡大 点数</label><input type="number" id="macd1" step="0.5"></div>
  <div class="row"><label>DIF&gt;0&gt;Sig 縮小 点数</label><input type="number" id="macd2" step="0.5"></div>
  <div class="row"><label>DIF&gt;0≤Sig 点数</label><input type="number" id="macd3" step="0.5"></div>
  <div class="row"><label>DIF≤0&gt;Sig 点数</label><input type="number" id="macd4" step="0.5"></div>
  <div class="row"><label>DIF≤0≤Sig 縮小 点数</label><input type="number" id="macd5" step="0.5"></div>
  <div class="row"><label>DIF≤0≤Sig 拡大 点数</label><input type="number" id="macd6" step="0.5"></div>
</div>

<div class="section">
  <div class="section-title">RSI（閾値 / 点数）</div>
  <div class="pair-row">
    <span class="pair-label">高値1</span>
    <div class="pair-inputs">
      <input type="number" id="rsiHigh1" step="1">
      <span>/</span>
      <input type="number" id="rsiHigh1Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">高値2</span>
    <div class="pair-inputs">
      <input type="number" id="rsiHigh2" step="1">
      <span>/</span>
      <input type="number" id="rsiHigh2Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">低値1</span>
    <div class="pair-inputs">
      <input type="number" id="rsiLow1" step="1">
      <span>/</span>
      <input type="number" id="rsiLow1Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">低値2</span>
    <div class="pair-inputs">
      <input type="number" id="rsiLow2" step="1">
      <span>/</span>
      <input type="number" id="rsiLow2Score" step="0.5">
    </div>
  </div>
  <div class="row"><label>平均/前回比較 点数</label><input type="number" id="rsiTrendScore" step="0.5"></div>
</div>

<div class="section">
  <div class="section-title">BB（ボリンジャーバンド）</div>
  <div class="row"><label>下限タッチ 点数</label><input type="number" id="bbLowerScore" step="0.5"></div>
  <div class="row"><label>上限タッチ 点数</label><input type="number" id="bbUpperScore" step="0.5"></div>
  <div class="row"><label>中央より上 点数</label><input type="number" id="bbMidUpScore" step="0.1"></div>
  <div class="row"><label>中央より下 点数</label><input type="number" id="bbMidDownScore" step="0.1"></div>
  <div class="row"><label>上限クロス(下抜け) 点数</label><input type="number" id="bbCrossUpperScore" step="0.5"></div>
  <div class="row"><label>下限クロス(上抜け) 点数</label><input type="number" id="bbCrossLowerScore" step="0.5"></div>
  <div class="row"><label>中央クロス(上抜け) 点数</label><input type="number" id="bbCrossMidUpScore" step="0.5"></div>
  <div class="row"><label>中央クロス(下抜け) 点数</label><input type="number" id="bbCrossMidDownScore" step="0.5"></div>
</div>

<div class="section">
  <div class="section-title">資金調達率（閾値 / 点数）</div>
  <div class="pair-row">
    <span class="pair-label">高値1</span>
    <div class="pair-inputs">
      <input type="number" id="frHigh1" step="0.001">
      <span>/</span>
      <input type="number" id="frHigh1Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">高値2</span>
    <div class="pair-inputs">
      <input type="number" id="frHigh2" step="0.0001">
      <span>/</span>
      <input type="number" id="frHigh2Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">低値1</span>
    <div class="pair-inputs">
      <input type="number" id="frLow1" step="0.001">
      <span>/</span>
      <input type="number" id="frLow1Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">低値2</span>
    <div class="pair-inputs">
      <input type="number" id="frLow2" step="0.0001">
      <span>/</span>
      <input type="number" id="frLow2Score" step="0.5">
    </div>
  </div>
  <div class="pair-row">
    <span class="pair-label">低値3</span>
    <div class="pair-inputs">
      <input type="number" id="frLow3" step="0.00001">
      <span>/</span>
      <input type="number" id="frLow3Score" step="0.5">
    </div>
  </div>
</div>

<div class="save-bar">
  <button class="btn btn-reset" onclick="resetAll()">リセット</button>
  <button class="btn btn-save" onclick="saveAll()">保存</button>
</div>

<script>
var PROXY = "https://bingx-proxy-v83p.onrender.com";

var SETTINGS_DEFAULT = {
  rsiHigh1:90, rsiHigh1Score:-3,
  rsiHigh2:75, rsiHigh2Score:-1,
  rsiLow1:10, rsiLow1Score:3,
  rsiLow2:25, rsiLow2Score:1,
  rsiTrendScore:3,
  bbLowerScore:2, bbUpperScore:-2, bbMidUpScore:-2, bbMidDownScore:2,
  bbCrossUpperScore:-3, bbCrossLowerScore:3, bbCrossMidUpScore:2, bbCrossMidDownScore:-2,
  macd1:3, macd2:1.5, macd3:-2, macd4:2, macd5:-1.5, macd6:-3,
  frHigh1:0.01, frHigh1Score:-1,
  frHigh2:0.0001, frHigh2Score:-0.5,
  frLow1:-0.01, frLow1Score:1.5,
  frLow2:-0.0001, frLow2Score:1,
  frLow3:-0.00005, frLow3Score:0.5,
  thWeak:5, thMid:7, thStrong:9,
  holdPlus:3, holdMinus:-3,
  tpslRate50:8, tpslRate30:7, tpslRate10:6, tpslRateLow:5
};

var DEFAULT_MARGIN = 20;
var DEFAULT_LEVERAGE = 10;

var loadedOk = { signal: false, trade: false };

function setStatus(text, isErr) {
  var el = document.getElementById("statusBar");
  el.textContent = text;
  el.className = "status" + (isErr ? " err" : "");
}

function applyDefaults() {
  for (var key in SETTINGS_DEFAULT) {
    var el = document.getElementById(key);
    if (el) el.value = SETTINGS_DEFAULT[key];
  }
  document.getElementById("tradeMargin").value = DEFAULT_MARGIN;
  document.getElementById("tradeLeverage").value = DEFAULT_LEVERAGE;
}

function updateStatus() {
  if (loadedOk.signal && loadedOk.trade) {
    setStatus("サーバーの保存済み設定を読み込みました", false);
  } else if (!loadedOk.signal && !loadedOk.trade) {
    setStatus("⚠ サーバーから読み込めませんでした（初期値を表示中）。このまま保存すると初期値で上書きされます", true);
  } else {
    setStatus("⚠ 一部の設定をサーバーから読み込めませんでした（該当項目は初期値）", true);
  }
}

function loadValues() {
  applyDefaults();

  var p1 = fetch(PROXY+"/signal-settings").then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    if (!d || typeof d !== "object") throw new Error("形式異常");
    for (var key in SETTINGS_DEFAULT) {
      var el = document.getElementById(key);
      var v = d[key];
      if (el && v !== null && v !== undefined && !isNaN(Number(v))) el.value = Number(v);
    }
    loadedOk.signal = true;
  }).catch(function(){ loadedOk.signal = false; });

  var p2 = fetch(PROXY+"/trade-settings").then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    if (d && d.margin != null) document.getElementById("tradeMargin").value = d.margin;
    if (d && d.leverage != null) document.getElementById("tradeLeverage").value = d.leverage;
    loadedOk.trade = true;
  }).catch(function(){ loadedOk.trade = false; });

  Promise.all([p1, p2]).then(updateStatus);
}

function saveAll() {
  if (!loadedOk.signal) {
    if (!confirm("サーバーから設定を読み込めていません。このまま保存すると保存済みの設定が画面の値で上書きされます。続けますか？")) return;
  }
  var newSettings = {};
  for (var key in SETTINGS_DEFAULT) {
    var el = document.getElementById(key);
    if (el) {
      var v = parseFloat(el.value);
      newSettings[key] = isNaN(v) ? SETTINGS_DEFAULT[key] : v;
    }
  }
  if (newSettings.holdMinus > newSettings.holdPlus) {
    alert("HOLD- の上限が HOLD+ の下限を超えています。値を見直してください。");
    return;
  }
  var margin = parseFloat(document.getElementById("tradeMargin").value) || DEFAULT_MARGIN;
  var leverage = parseInt(document.getElementById("tradeLeverage").value) || DEFAULT_LEVERAGE;
  var settingsStr = encodeURIComponent(JSON.stringify(newSettings));

  Promise.all([
    fetch(PROXY+"/signal-settings?settings="+settingsStr, {method:"POST"}),
    fetch(PROXY+"/trade-settings?margin="+margin+"&leverage="+leverage, {method:"POST"})
  ]).then(function(rs){
    for (var i=0;i<rs.length;i++) { if (!rs[i].ok) throw new Error("HTTP "+rs[i].status); }
    alert("設定を保存しました");
    window.location.href = "index.html";
  }).catch(function(e){
    alert("保存に失敗しました: "+e.message);
  });
}

function resetAll() {
  if (confirm("すべての設定をデフォルトに戻しますか？（保存を押すまでサーバーには反映されません）")) {
    applyDefaults();
  }
}

loadValues();
</script>
</body>
</html>
