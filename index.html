<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎛️ Trade Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #07070f; color: #dde; font-family: -apple-system, sans-serif; min-height: 100vh; padding-bottom: 48px; }
.header { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 16px 12px; border-bottom: 1px solid #12121f; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; background: #07070f; z-index: 100; }
.title { font-size: 20px; font-weight: 800; color: #fff; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { padding: 6px 14px; border-radius: 8px; border: 1px solid #00e5a044; background: #00e5a010; color: #00e5a0; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn.err { border-color: #ff4d6d; background: #ff4d6d20; color: #ff4d6d; font-weight: 700; }
.btn-gray { padding: 6px 14px; border-radius: 8px; border: 1px solid #33334a; background: #1a1a28; color: #888; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn-gray.on { border-color: #ff4d6d; background: #ff4d6d20; color: #ff4d6d; font-weight: 700; }
select { background: #0d0d1a; border: 1px solid #222236; color: #aaa; border-radius: 7px; padding: 5px 10px; font-size: 13px; }
.btn-notif { padding: 6px 14px; border-radius: 8px; border: 1px solid #5577ff44; background: #5577ff10; color: #5577ff; cursor: pointer; font-size: 13px; white-space: nowrap; }
.btn-notif.on { background: #5577ff30; border-color: #5577ff; }
.add-bar { display: flex; gap: 8px; padding: 10px 16px; background: #0d0d1a; border-bottom: 1px solid #12121f; align-items: center; flex-wrap: wrap; }
.add-bar input { flex: 1; min-width: 120px; background: #07070f; border: 1px solid #222236; color: #ccc; border-radius: 7px; padding: 6px 12px; font-size: 13px; }
.hidden { display: none; }
.section { padding: 14px 16px; border-bottom: 1px solid #12121f; }
.section-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.section-note { font-size: 11px; color: #555; font-weight: 400; white-space: nowrap; }
.watch-grid { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 0; }
.watch-btn { padding: 4px 10px; border-radius: 6px; border: 1px solid #222236; background: transparent; color: #666; cursor: pointer; font-size: 12px; }
.watch-btn.on { border-color: #00e5a044; color: #00e5a0; background: #00e5a010; }
.pos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.pos-card { background: #0d0d1a; border: 2px solid #9370db99; border-radius: 12px; padding: 14px; }
.pos-card.err { border-color: #ff4d6d99; }
.pos-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.pos-symbol { font-weight: 700; font-size: 15px; color: #fff; }
.pos-side { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 700; }
.pos-side.long { background: #00e5a030; color: #00e5a0; }
.pos-side.short { background: #ff4d6d30; color: #ff4d6d; }
.pos-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px solid #0f0f1c; gap: 8px; }
.pos-label { color: #666; white-space: nowrap; }
.pos-val { color: #ccc; font-variant-numeric: tabular-nums; text-align: right; }
.pos-err { font-size: 11px; color: #ff4d6d; word-break: break-all; }
.pnl-pos { color: #00e5a0; font-weight: 700; }
.pnl-neg { color: #ff4d6d; font-weight: 700; }
.empty-msg { color: #444; text-align: center; padding: 24px; font-size: 13px; }
.warn-bar { margin: 0 16px 10px; padding: 8px 12px; border-radius: 8px; background: #ff4d6d18; border: 1px solid #ff4d6d44; color: #ff8fa3; font-size: 12px; }
.signal-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; }
.sig-buy { background: #00e5a030; color: #00e5a0; }
.sig-sell { background: #ff4d6d30; color: #ff4d6d; }
.sig-hold { background: #8888bb30; color: #8888bb; }
.toast-wrap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; width: 90%; max-width: 360px; pointer-events: none; }
.toast { border-radius: 12px; padding: 12px 16px; font-size: 13px; box-shadow: 0 4px 24px #0008; animation: slideIn 0.3s ease; pointer-events: auto; }
.toast.buy { background: #00e5a0ee; color: #000; }
.toast.sell { background: #ff4d6dee; color: #fff; }
@keyframes slideIn { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="toast-wrap" id="toastWrap"></div>
<div class="header">
  <div class="title">🎛️ Trade Panel</div>
  <div class="controls">
    <select id="intervalSelect">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h">1h</option>
      <option value="4h" selected>4h</option>
      <option value="1d">1d</option>
    </select>
    <button class="btn-notif" id="autoTradeBtn" onclick="toggleAutoTrade()">🤖 自動 OFF</button>
    <button class="btn" id="modeBtn" onclick="toggleMode()">🔀 通常</button>
    <button class="btn" onclick="toggleAdd()">＋ 追加</button>
    <button class="btn-gray" id="slBtn" onclick="showCooldownInfo()">SL</button>
    <button class="btn" id="errBtn" onclick="showErrorInfo()">ｴﾗｰ</button>
    <a href="settings.html" class="btn" id="settingsLink" style="text-decoration:none;display:inline-block">⚙️ 設定</a>
    <button class="btn" onclick="clearCacheOnly()">🧹 ﾘﾛｰﾄﾞ</button>
    <a href="log.html" class="btn" style="text-decoration:none;display:inline-block">📋 ﾛｸﾞ</a>
  </div>
</div>
<div class="add-bar hidden" id="addBar">
  <input id="pairInput" placeholder="例: DOGE または DOGE-USDT" />
  <button class="btn" onclick="addPair()">追加</button>
</div>

<div id="warnArea"></div>

<div class="section">
  <div class="section-title"><span id="watchTitle">監視銘柄</span><span class="section-note">タップで監視ON/OFF・長押しで削除</span></div>
  <div class="watch-grid" id="watchGrid"></div>
</div>

<div class="section">
  <div class="section-title"><span id="posTitle">保有ポジション</span><span class="section-note" id="posNote"></span></div>
  <div class="pos-grid" id="posGrid">
    <div class="empty-msg">読み込み中...</div>
  </div>
</div>

<script>
var PROXY = "https://bingx-proxy-v83p.onrender.com";
var appToken = null;

// モードは normal / cross / div の3つ。順送りで切り替える
var MODE_ORDER = ["normal", "cross", "div"];
var MODE_LABEL = { normal: "通常", cross: "ｸﾛｽ", div: "ﾀﾞｲﾊﾞｰ" };
var MODE_PREFIX = { normal: "", cross: "/cross", div: "/div" };
var MODE_SETTINGS = { normal: "settings.html", cross: "settings_cross.html", div: "settings_div.html" };

var MODE = "normal";
try {
  var savedMode = localStorage.getItem("panelMode");
  if (MODE_ORDER.indexOf(savedMode) >= 0) MODE = savedMode;
} catch (e) {}

function modeApi(path) {
  return PROXY + MODE_PREFIX[MODE] + path;
}

function saveMode() { try { localStorage.setItem("panelMode", MODE); } catch (e) {} }

function updateModeBtn() {
  document.getElementById("modeBtn").textContent = "🔀 " + MODE_LABEL[MODE];
  document.getElementById("settingsLink").href = MODE_SETTINGS[MODE];
}

function nextMode() {
  var i = MODE_ORDER.indexOf(MODE);
  return MODE_ORDER[(i + 1) % MODE_ORDER.length];
}

function toggleMode() {
  var target = nextMode();
  var targetLabel = MODE_LABEL[target] + "ﾓｰﾄﾞ";
  if (!confirm(targetLabel + "に切り替えますか？")) return;

  Promise.all([
    getJSON(modeApi("/autotrade")).catch(function() { return null; }),
    getJSON(modeApi("/position-details")).catch(function() { return null; })
  ]).then(function(rs) {
    var autoRes = rs[0];
    var posRes = rs[1];
    var isEnabled = autoRes && autoRes.enabled;
    var posCount = posRes && posRes.positions ? posRes.positions.length : 0;

    if (isEnabled) {
      alert("自動売買がONのため切り替えできません。先に🤖ボタンで自動売買をOFFにしてください。");
      return;
    }
    if (posCount > 0) {
      alert("保有中のポジションがあるため切り替えできません（" + posCount + "件）。先にポジションを精算してください。");
      return;
    }

    MODE = target;
    saveMode();
    updateModeBtn();
    showToast("モード切替", targetLabel + "に切り替えました", "buy", 3000);
    autoTradeEnabled = false;
    updateAutoTradeBtn();
    checkAutoTradeStatus();
    checkErrorStatus();
    checkCooldown();
    loadPositions();
  }).catch(function(e) {
    alert("状態の確認に失敗しました: " + e.message + "\n切り替えを中止しました。");
  });
}

function getAppToken() {
  if (appToken) return appToken;
  var input = prompt("合言葉を入力してください");
  if (input) appToken = input;
  return appToken;
}

function getJSON(url) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", url);
    xhr.onload = function() {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
      } else { reject(new Error("HTTP " + xhr.status)); }
    };
    xhr.onerror = function() { reject(new Error("Network error")); };
    xhr.timeout = 30000;
    xhr.ontimeout = function() { reject(new Error("Timeout")); };
    xhr.send();
  });
}

function postJSON(url) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open("POST", url);
    xhr.onload = function() {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); } catch (e) { reject(e); }
      } else { reject(new Error("HTTP " + xhr.status)); }
    };
    xhr.onerror = function() { reject(new Error("Network error")); };
    xhr.timeout = 30000;
    xhr.ontimeout = function() { reject(new Error("Timeout")); };
    xhr.send();
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    if (c === "&") return "&amp;";
    if (c === "<") return "&lt;";
    if (c === ">") return "&gt;";
    if (c === '"') return "&quot;";
    return "&#39;";
  });
}

function showToast(title, message, type, duration) {
  duration = duration || 4000;
  var wrap = document.getElementById("toastWrap");
  var toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.innerHTML = "<div style='font-weight:800'>" + escapeHtml(title) + "</div><div style='font-size:12px;margin-top:2px'>" + escapeHtml(message) + "</div>";
  wrap.appendChild(toast);
  setTimeout(function() {
    toast.style.animation = "slideOut 0.3s ease forwards";
    setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
  }, duration);
}

var WATCHLIST = [];
try { WATCHLIST = JSON.parse(localStorage.getItem("panelWatchlist") || "[]"); } catch (e) { WATCHLIST = []; }
if (!WATCHLIST) WATCHLIST = [];
function saveWatchlist() { try { localStorage.setItem("panelWatchlist", JSON.stringify(WATCHLIST)); } catch (e) {} }

var ACTIVE = null;
try { ACTIVE = JSON.parse(localStorage.getItem("panelActive")); } catch (e) { ACTIVE = null; }
if (!ACTIVE) ACTIVE = WATCHLIST.slice();
function saveActive() { try { localStorage.setItem("panelActive", JSON.stringify(ACTIVE)); } catch (e) {} }

var autoTradeEnabled = false;
var errorInfo = null;
var cooldownInfo = null;

function updateAutoTradeBtn() {
  var btn = document.getElementById("autoTradeBtn");
  btn.textContent = autoTradeEnabled ? "🤖 自動 ON" : "🤖 自動 OFF";
  btn.classList.toggle("on", autoTradeEnabled);
}

function saveInterval() {
  try { localStorage.setItem("panelInterval", document.getElementById("intervalSelect").value); } catch (e) {}
}

function restoreInterval() {
  var saved = null;
  try { saved = localStorage.getItem("panelInterval"); } catch (e) {}
  if (!saved) return;
  var sel = document.getElementById("intervalSelect");
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === saved) {
      sel.value = saved;
      return;
    }
  }
}

function syncWatchlist() {
  var symbols = ACTIVE.join(",");
  var interval = document.getElementById("intervalSelect").value;
  return postJSON(PROXY + "/watchlist?symbols=" + encodeURIComponent(symbols) + "&interval=" + interval);
}

function toggleAutoTrade() {
  if (!autoTradeEnabled) {
    var token = getAppToken();
    if (!token) return;
    if (ACTIVE.length === 0) {
      if (!confirm("監視中の銘柄が0件です。このままONにしますか？")) return;
    }
    if (!confirm(MODE_LABEL[MODE] + "ﾓｰﾄﾞで自動売買をONにします。よろしいですか？")) return;
    syncWatchlist().then(function() {
      return postJSON(modeApi("/autotrade?enabled=true&token=" + encodeURIComponent(token)));
    }).then(function() {
      autoTradeEnabled = true;
      updateAutoTradeBtn();
      checkErrorStatus();
      showToast("自動売買", "ONにしました", "buy", 4000);
    }).catch(function(e) {
      showToast("自動売買", "ON失敗: " + e.message, "sell", 5000);
    });
  } else {
    postJSON(modeApi("/autotrade?enabled=false")).then(function() {
      autoTradeEnabled = false;
      updateAutoTradeBtn();
      showToast("自動売買", "OFFにしました", "sell", 3000);
    }).catch(function(e) {
      showToast("自動売買", "OFF失敗: " + e.message, "sell", 5000);
    });
  }
}

function fmtTimeMs(ms) {
  if (!ms) return "-";
  var d = new Date(ms);
  var p = function(n) { return ("0" + n).slice(-2); };
  return p(d.getMonth() + 1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtRemain(sec) {
  if (sec <= 0) return "まもなく解除";
  var m = Math.floor(sec / 60);
  var s = sec % 60;
  if (m >= 60) {
    var h = Math.floor(m / 60);
    return h + "時間" + (m % 60) + "分";
  }
  if (m > 0) return m + "分" + ("0" + s).slice(-2) + "秒";
  return s + "秒";
}

function checkErrorStatus() {
  if (MODE === "cross" || MODE === "div") {
    getJSON(modeApi("/rate-status")).then(function(res) {
      errorInfo = {
        has_error: !!(res.entry_blocked || res.last_disable_reason || res.last_sl_error),
        entry_blocked: res.entry_blocked,
        entry_block_reason: res.entry_block_reason,
        entry_block_time: res.entry_block_time || 0,
        auto_trade_enabled: res.auto_trade_enabled,
        disable_reason: res.last_disable_reason,
        disable_time: res.disable_time || 0,
        sl_error: res.last_sl_error,
        margin: res.margin,
        leverage: res.leverage
      };
      document.getElementById("errBtn").classList.toggle("err", !!errorInfo.has_error);
    }).catch(function() {});
    return;
  }
  getJSON(PROXY + "/error-status").then(function(res) {
    errorInfo = res;
    document.getElementById("errBtn").classList.toggle("err", !!res.has_error);
  }).catch(function() {});
}

function checkCooldown() {
  if (MODE === "cross") {
    cooldownInfo = { count: 0, cooldowns: [] };
    document.getElementById("slBtn").classList.remove("on");
    return;
  }
  if (MODE === "div") {
    // ダイバーは rate-status の cooldown 配列（key は "銘柄|方向"）を読む
    getJSON(modeApi("/rate-status")).then(function(res) {
      var list = res.cooldown || [];
      var items = [];
      for (var i = 0; i < list.length; i++) {
        var parts = String(list[i].key || "").split("|");
        items.push({
          symbol: parts[0] || "?",
          side: parts[1] || "",
          reason: "TP/SL/手動決済",
          remaining_sec: list[i].remaining_sec || 0
        });
      }
      cooldownInfo = { count: items.length, cooldowns: items, cooldown_seconds: res.cooldown_seconds };
      document.getElementById("slBtn").classList.toggle("on", items.length > 0);
    }).catch(function() {});
    return;
  }
  getJSON(PROXY + "/cooldown").then(function(res) {
    cooldownInfo = res;
    document.getElementById("slBtn").classList.toggle("on", (res.count || 0) > 0);
  }).catch(function() {});
}

function showCooldownInfo() {
  if (MODE === "cross") {
    alert("クロスモードにはSLクールダウンの仕組みはありません。");
    return;
  }
  if (!cooldownInfo) {
    alert("状態を取得できていません。少し待ってからもう一度お試しください。");
    checkCooldown();
    return;
  }
  var list = cooldownInfo.cooldowns || [];
  if (list.length === 0) {
    if (MODE === "div") {
      var sec = cooldownInfo.cooldown_seconds || 0;
      alert("クールダウンはありません。\n\nTP・SL・手動決済でポジションが消えると、その銘柄の同方向エントリーを一定時間停止します（現在 " + Math.round(sec / 60) + "分／足の長さ×2）。\n（逆方向のエントリーは可能です）");
    } else {
      alert("SLクールダウンはありません。\n\nSL発動または手動決済でポジションが消えると、その銘柄の同方向エントリーを1時間停止します。\n（逆方向のエントリーは可能です）");
    }
    return;
  }
  var lines = [];
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    var sideLabel = c.side === "LONG" ? "ロング" : (c.side === "SHORT" ? "ショート" : "-");
    lines.push(String(c.symbol).replace("-USDT", "") + " " + sideLabel + "  残り " + fmtRemain(c.remaining_sec) + "  " + (c.reason || "SL/手動決済"));
  }
  var msg = "クールダウン中（同方向のエントリーを停止）\n\n"
    + lines.join("\n") + "\n\n"
    + "すべて解除しますか？";
  if (!confirm(msg)) return;

  // ダイバーの解除は GET、通常は POST
  var clearReq = (MODE === "div")
    ? getJSON(modeApi("/clear-cooldown"))
    : postJSON(PROXY + "/cooldown/clear");
  clearReq.then(function(r) {
    showToast("クールダウン", (r.cleared || 0) + "件を解除しました", "buy", 4000);
    checkCooldown();
  }).catch(function(e) {
    showToast("エラー", "解除に失敗: " + e.message, "sell", 5000);
  });
}

function showErrorInfo() {
  if (!errorInfo) {
    alert("状態を取得できていません。少し待ってからもう一度お試しください。");
    checkErrorStatus();
    return;
  }
  var e = errorInfo;

  if (e.entry_blocked) {
    var msg = "新規エントリーが停止中です。\n\n"
      + "理由: " + (e.entry_block_reason || "不明") + "\n"
      + "発生時刻: " + fmtTimeMs(e.entry_block_time) + "\n\n"
      + "決済・SL更新・表示更新は動作しています。\n"
      + "証拠金: " + e.margin + " USDT / レバレッジ: " + e.leverage + "倍\n\n"
      + "新規エントリーを再開しますか？\n（残高が不足したままだと再度停止します）";
    if (confirm(msg)) {
      postJSON(modeApi("/resume-entry")).then(function() {
        showToast("エントリー再開", "新規エントリーを再開しました", "buy", 4000);
        checkErrorStatus();
      }).catch(function(err) {
        showToast("エラー", "再開に失敗: " + err.message, "sell", 5000);
      });
    }
    return;
  }

  if (!e.auto_trade_enabled && e.disable_reason) {
    alert("自動売買が停止しました。\n\n"
      + "理由: " + e.disable_reason + "\n"
      + "発生時刻: " + fmtTimeMs(e.disable_time) + "\n\n"
      + "設定を確認して修正してから、🤖ボタンでONに戻してください。\n"
      + "（レバレッジ上限・最小注文数量・APIキー権限などが原因になります）");
    return;
  }

  if (e.sl_error) {
    var noteText = (MODE === "normal") ? "SLは3分ごとに自動補完されます。\n" : "";
    if (confirm("TP/SL関連の警告があります。\n\n"
      + e.sl_error + "\n\n"
      + noteText + "この警告を消しますか？")) {
      postJSON(modeApi("/clear-errors")).then(function() {
        checkErrorStatus();
      }).catch(function() {});
    }
    return;
  }

  alert("エラーはありません。");
}

function renderWatchlist() {
  var grid = document.getElementById("watchGrid");
  var sorted = WATCHLIST.slice().sort();
  var html = "";
  for (var i = 0; i < sorted.length; i++) {
    var sym = sorted[i];
    var on = ACTIVE.indexOf(sym) >= 0 ? " on" : "";
    html += "<button class='watch-btn" + on + "' onclick='toggleWatch(\"" + sym + "\")' ontouchstart='startLongPress(\"" + sym + "\")' ontouchend='cancelLongPress()'>" + escapeHtml(sym.replace("-USDT", "")) + "</button>";
  }
  grid.innerHTML = html || "<div class='empty-msg' style='padding:8px'>監視銘柄がありません</div>";
  document.getElementById("watchTitle").textContent = "監視銘柄 (" + ACTIVE.length + "/" + WATCHLIST.length + ")";
}

var longPressTimer = null;
var longPressFired = false;

function startLongPress(sym) {
  longPressFired = false;
  longPressTimer = setTimeout(function() {
    longPressFired = true;
    removePairConfirm(sym);
  }, 700);
}

function cancelLongPress() {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}

function toggleWatch(sym) {
  if (longPressFired) { longPressFired = false; return; }
  var idx = ACTIVE.indexOf(sym);
  if (idx >= 0) ACTIVE.splice(idx, 1); else ACTIVE.push(sym);
  saveActive();
  renderWatchlist();
  syncWatchlist().catch(function() {});
}

function toggleAdd() {
  var bar = document.getElementById("addBar");
  if (bar.classList.contains("hidden")) bar.classList.remove("hidden");
  else bar.classList.add("hidden");
}

function addPair() {
  var input = document.getElementById("pairInput");
  var sym = input.value.toUpperCase().replace("/", "-").trim();
  if (!sym) return;
  if (sym.indexOf("-") < 0) sym = sym + "-USDT";
  if (WATCHLIST.indexOf(sym) >= 0) {
    input.value = "";
    document.getElementById("addBar").classList.add("hidden");
    return;
  }
  var target = sym;
  getJSON(PROXY + "/ticker?symbol=" + encodeURIComponent(target)).then(function(res) {
    var d = res && res.data;
    var td = (d && d.length !== undefined) ? d[0] : d;
    if (!td || !td.lastPrice) throw new Error("該当なし");
    WATCHLIST.push(target);
    saveWatchlist();
    renderWatchlist();
    input.value = "";
    document.getElementById("addBar").classList.add("hidden");
  }).catch(function() {
    showToast("追加できません", target.replace("-USDT", "") + " はBingXに存在しません", "sell", 4000);
  });
}

function removePairConfirm(sym) {
  if (!confirm(sym.replace("-USDT", "") + " を一覧から削除しますか？")) return;
  var idx = WATCHLIST.indexOf(sym);
  if (idx >= 0) WATCHLIST.splice(idx, 1);
  var aidx = ACTIVE.indexOf(sym);
  if (aidx >= 0) ACTIVE.splice(aidx, 1);
  saveWatchlist();
  saveActive();
  renderWatchlist();
  syncWatchlist().catch(function() {});
}

function toNum(v) {
  if (v === null || v === undefined || v === "") return null;
  var n = Number(v);
  return isNaN(n) ? null : n;
}

function fmtPrice(p) {
  p = toNum(p);
  if (p === null) return "-";
  if (p >= 10000) return p.toFixed(1);
  if (p >= 10) return p.toFixed(2);
  if (p >= 1) return p.toFixed(3);
  if (p >= 0.1) return p.toFixed(4);
  if (p >= 0.01) return p.toFixed(5);
  return p.toFixed(6);
}

function fmtQty(q) {
  q = toNum(q);
  if (q === null) return "-";
  var s = (Math.abs(q) >= 1) ? q.toFixed(4) : q.toFixed(8);
  if (s.indexOf(".") >= 0) {
    s = s.replace(/0+$/, "");
    s = s.replace(/\.$/, "");
  }
  return s;
}

function fmtNum(v) {
  var n = toNum(v);
  return n === null ? "-" : n;
}

function signalBadgeClass(type) {
  if (!type) return "sig-hold";
  if (type === "BUY") return "sig-buy";
  if (type === "SELL") return "sig-sell";
  return "sig-hold";
}

function setWarn(msg) {
  var area = document.getElementById("warnArea");
  area.innerHTML = msg ? "<div class='warn-bar'>" + escapeHtml(msg) + "</div>" : "";
}

function pad2(n) { return ("0" + n).slice(-2); }

function loadPositions() {
  getJSON(modeApi("/position-details")).then(function(res) {
    var grid = document.getElementById("posGrid");
    var note = document.getElementById("posNote");
    var list = res.positions || [];

    if (res.error) {
      setWarn((res.stale ? "最新化に失敗（前回の値を表示中）: " : "取得エラー: ") + res.error);
    } else {
      setWarn("");
    }

    var totalPnl = 0;
    var pnlCount = 0;
    for (var i = 0; i < list.length; i++) {
      var v = toNum(list[i].unrealized_profit);
      if (v !== null) { totalPnl += v; pnlCount++; }
    }
    var pnlHtml = "";
    if (pnlCount > 0) {
      var col = totalPnl >= 0 ? "#00e5a0" : "#ff4d6d";
      pnlHtml = " <span style='font-size:13px;color:" + col + "'>" + (totalPnl >= 0 ? "+" : "") + totalPnl.toFixed(2) + " USDT</span>";
    }
    document.getElementById("posTitle").innerHTML = "保有ポジション (" + list.length + ")" + pnlHtml;

    var now = new Date();
    note.textContent = "更新 " + pad2(now.getHours()) + ":" + pad2(now.getMinutes()) + ":" + pad2(now.getSeconds());

    if (list.length === 0) {
      grid.innerHTML = "<div class='empty-msg'>保有ポジションはありません</div>";
      return;
    }

    var html = "";
    for (var j = 0; j < list.length; j++) {
      var p = list[j];
      if (p.error) {
        html += "<div class='pos-card err'>" +
          "<div class='pos-header'><span class='pos-symbol'>" + escapeHtml(String(p.symbol || "?").replace("-", "/")) + "</span></div>" +
          "<div class='pos-err'>" + escapeHtml(p.error) + "</div>" +
        "</div>";
        continue;
      }
      var pnl = toNum(p.unrealized_profit);
      var pnlClass = (pnl === null) ? "pos-val" : (pnl >= 0 ? "pnl-pos" : "pnl-neg");
      var pnlStr = (pnl === null) ? "-" : ((pnl >= 0 ? "+" : "") + pnl.toFixed(2) + " USDT");
      var sideClass = p.side === "LONG" ? "long" : "short";
      var sideLabel = p.side === "LONG" ? "ロング" : (p.side === "SHORT" ? "ショート" : "-");
      var symbolText = escapeHtml(String(p.symbol || "").replace("-", "/"));
      if (MODE !== "normal") symbolText += "（" + sideLabel + "）";
      var hasTp = ("tp_price" in p);
      var tpRowHtml = hasTp
        ? "<div class='pos-row'><span class='pos-label'>TP</span><span class='pos-val'>" + fmtPrice(p.tp_price) + "</span></div>"
        : "";
      var hasSignalInfo = ("entry_signal" in p);
      var divSig = p.div_signal || null;
      var divRowsHtml = "";
      if (divSig) {
        var strengthLabel = divSig.strength === "strong" ? "強" : "弱";
        var atrLabel = (divSig.atr_ratio === null || divSig.atr_ratio === undefined) ? "-" : (divSig.atr_ratio + "ATR");
        divRowsHtml =
          "<div class='pos-row' style='border-bottom:none'><span class='pos-label'>取得時判定</span><span class='pos-val'><span class='signal-badge " + signalBadgeClass(divSig.side) + "'>" + escapeHtml(divSig.side || "-") + "</span> " + strengthLabel + (divSig.reversed ? "(反転)" : "") + " / 差" + atrLabel + " / 間隔" + fmtNum(divSig.gap) + "本</span></div>";
      }
      var signalRowsHtml = "";
      if (hasSignalInfo) {
        signalRowsHtml =
          "<div class='pos-row'><span class='pos-label'>取得時シグナル</span><span class='pos-val'><span class='signal-badge " + signalBadgeClass(p.entry_signal) + "'>" + escapeHtml(p.entry_signal || "-") + "</span> " + fmtNum(p.entry_score) + " / トレンド:" + fmtNum(p.entry_trend) + "</span></div>" +
          "<div class='pos-row' style='border-bottom:none'><span class='pos-label'>現在シグナル</span><span class='pos-val'><span class='signal-badge " + signalBadgeClass(p.current_signal) + "'>" + escapeHtml(p.current_signal || "-") + "</span> " + fmtNum(p.current_score) + " / トレンド:" + fmtNum(p.current_trend) + "</span></div>";
      }
      html += "<div class='pos-card'>" +
        "<div class='pos-header'>" +
          "<span class='pos-symbol'>" + symbolText + "</span>" +
          "<span class='pos-side " + sideClass + "'>" + sideLabel + "</span>" +
        "</div>" +
        "<div class='pos-row'><span class='pos-label'>現在価格</span><span class='pos-val'>" + fmtPrice(p.current_price) + "</span></div>" +
        "<div class='pos-row'><span class='pos-label'>取得価格</span><span class='pos-val'>" + fmtPrice(p.entry_price) + "</span></div>" +
        "<div class='pos-row'><span class='pos-label'>数量</span><span class='pos-val'>" + fmtQty(p.qty) + "</span></div>" +
        "<div class='pos-row'><span class='pos-label'>SL</span><span class='pos-val'>" + fmtPrice(p.sl_price) + "</span></div>" +
        tpRowHtml +
        "<div class='pos-row'" + ((hasSignalInfo || divSig) ? "" : " style='border-bottom:none'") + "><span class='pos-label'>損益</span><span class='" + pnlClass + "'>" + pnlStr + "</span></div>" +
        signalRowsHtml +
        divRowsHtml +
      "</div>";
    }
    grid.innerHTML = html;
  }).catch(function(e) {
    document.getElementById("posGrid").innerHTML = "<div class='empty-msg'>⚠ 取得失敗: " + escapeHtml(e.message) + "</div>";
  });
}

function clearCacheOnly() {
  if (!confirm("キャッシュのみクリアして再読み込みします。銘柄は残ります。")) return;
  if ('caches' in window) {
    caches.keys().then(function(names) {
      names.forEach(function(name) { caches.delete(name); });
    });
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(reg) { reg.unregister(); });
    });
  }
  var url = window.location.href.split('?')[0] + '?t=' + Date.now();
  window.location.href = url;
}

function checkAutoTradeStatus() {
  getJSON(modeApi("/autotrade")).then(function(res) {
    if (autoTradeEnabled !== res.enabled) {
      autoTradeEnabled = res.enabled;
      updateAutoTradeBtn();
    }
  }).catch(function() {});
}

document.getElementById("intervalSelect").addEventListener("change", function() {
  saveInterval();
  syncWatchlist().catch(function() {});
});

updateModeBtn();
restoreInterval();
renderWatchlist();
checkAutoTradeStatus();
checkErrorStatus();
checkCooldown();
loadPositions();
syncWatchlist().catch(function() {});
setInterval(loadPositions, 30000);
setInterval(checkAutoTradeStatus, 60000);
setInterval(checkErrorStatus, 60000);
setInterval(checkCooldown, 60000);
</script>
